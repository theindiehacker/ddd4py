name: "🧹 actionlint"

# ワークフロー定義の構文を検査する (run: 内のシェルは内蔵の shellcheck が見る)。
on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "workflow 構文チェック"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install actionlint"
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" actionlint
          rm -f "$ARCHIVE"
          actionlint --version

      - name: "actionlint"
        shell: bash
        run: |
          set -euo pipefail
          # workflow command 形式で出力し、検出箇所を PR に annotation 表示する
          actionlint -format $'{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'

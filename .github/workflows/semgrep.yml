name: "🛡️ Semgrep"

# アプリケーションコードを Semgrep CE（SAST, ルールセット p/default・severity ERROR のみ）でスキャンする。
# --baseline-commit により「PR で新規に増えた検出」のみを対象とするため、
# 既存コードの検出が無関係な PR をブロックすることはない。
# 誤検知は承認必須の .semgrepignore で抑制する（インライン nosemgrep は下記 --disable-nosem で無効化）。
#
# ruff の select = ["ALL"] は flake8-bandit (S) を含むため一部は重複するが、
# ruff は AST の単発マッチのみで taint / dataflow を追わないため、検知層としては別物。
on:
  pull_request:
    branches: [ main ]

# 既定は無権限。必要な job にだけ最小権限を与える。
permissions: {}

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # job 名がそのまま PR のチェック名になる (必須ステータスチェックの登録名)。変更しない。
    name: "アプリケーションコードをスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      # semgrep/semgrep:1.169.0 を digest 固定（改ざん防止）
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # --baseline-commit が base コミットを参照するため全履歴が必要
          persist-credentials: false

      - name: "Semgrep スキャン"
        shell: bash
        env:
          BASELINE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # --disable-nosem: インライン nosemgrep コメントを無効化（抑制は承認必須の .semgrepignore に限定する）
          # --json-output: stdout のテキスト出力は保ったまま、annotation 生成用の JSON を併出力する
          rc=0
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics off \
            --disable-version-check \
            --disable-nosem \
            --baseline-commit "${BASELINE}" \
            --json-output=semgrep-report.json \
            . || rc=$?

          # 検出箇所を PR に annotation 表示する
          if [ -s semgrep-report.json ]; then
            python3 - <<'PY'
          import json

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          with open("semgrep-report.json") as f:
              report = json.load(f)
          for r in report.get("results", []):
              msg = r.get("extra", {}).get("message", "")
              print(f"::error file={r['path']},line={r['start']['line']}::semgrep ({r['check_id']}): {esc(msg)}")
          PY
          fi
          exit "${rc}"

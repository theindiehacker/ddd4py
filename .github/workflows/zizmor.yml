name: "🛡️ zizmor"

# GitHub Actions のワークフロー / action 定義を zizmor で静的解析し、
# severity HIGH 以上の検出でマージをブロックする。
#
# 元は org 共通リポジトリ (github-workflows) の必須ワークフローで、対象外の PR を skip する
# 判定を dorny/paths-filter で job 内に持っていたが、自リポジトリ所有になり不要になった。
# on.pull_request.paths で絞る形にもしない (対象外の PR でチェックが報告されず、
# 必須ステータスチェックに指定すると PR が永久に pending になるため)。
# 対象は .github/workflows/ の数ファイルのみのため、差分で絞らず常に repo 全体を走査する。
on:
  pull_request:
    branches: [ main ]

# 既定は無権限。必要な job にだけ最小権限を与える。
permissions: {}

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # job 名がそのまま PR のチェック名になる (必須ステータスチェックの登録名)。変更しない。
    name: "GitHub Actions 設定をスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "インライン ignore コメントの禁止"
        # zizmor の --no-ignores は .github/zizmor.yml による抑制まで無効化してしまうため、
        # インラインコメントのトークンの存在自体を禁止する（抑制は .github/zizmor.yml に限定する）。
        # .github/zizmor.yml は org ルールセット「セキュリティ設定変更の承認必須化」の対象であり、
        # 変更にはセキュリティチームの承認が要る。インライン抑制はそのゲートを迂回してしまう。
        # 検査対象は zizmor がスキャンし得る Actions 関連ファイルのみ（ドキュメント等の誤検知を避ける）
        shell: bash
        run: |
          set -euo pipefail
          if git grep -InE 'zizmor:[[:space:]]*ignore' -- \
            ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' \
            ':(glob)**/action.yml' ':(glob)**/action.yaml'; then
            echo "::error::インラインの ignore コメントは使用できません。.github/zizmor.yml で抑制してください（変更にはセキュリティチームの承認が必要）"
            exit 1
          fi

      - name: "Install zizmor"
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
          VERSION: 1.27.0
          SHA256: 277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f
        run: |
          set -euo pipefail
          ARCHIVE="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" zizmor
          rm -f "$ARCHIVE"
          zizmor --version

      - name: "zizmor スキャン"
        shell: bash
        env:
          # GH_TOKEN があると online audit（impostor-commit / known-vulnerable-actions 等）も有効になる
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 設定ファイルの自動探索はリポジトリ直下や入力ファイルの祖先ディレクトリの zizmor.yml / zizmor.yaml
          # にも及び、承認必須の対象外パスから検出を抑制できてしまうため、
          # 承認必須の .github/zizmor.yml に固定する（未作成なら設定なしで実行する）
          config_args=(--no-config)
          if [ -f .github/zizmor.yml ]; then
            config_args=(--config .github/zizmor.yml)
          fi

          # --format github: 検出箇所を PR に annotation 表示する
          zizmor --no-progress --format github --min-severity high "${config_args[@]}" .

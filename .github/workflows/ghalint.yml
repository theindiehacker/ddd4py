name: "🛡️ ghalint"

# permissions 未設定・アクションの SHA 未固定など、構文ではなくセキュリティ観点の
# ポリシー違反を検出する。
#
# 元は org 共通リポジトリ (github-workflows) の必須ワークフローで、対象外の PR を skip する
# 判定を dorny/paths-filter で job 内に持っていたが、自リポジトリ所有になり不要になった。
# on.pull_request.paths で絞る形にもしない (対象外の PR でチェックが報告されず、
# 必須ステータスチェックに指定すると PR が永久に pending になるため)。
# なお ghalint run は個別ファイル指定ができず、実行時は常に .github/workflows/ 全体が対象になる。
on:
  pull_request:
    branches: [ main ]

# 既定は無権限。必要な job にだけ最小権限を与える。
permissions: {}

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: ghalint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # job 名がそのまま PR のチェック名になる (必須ステータスチェックの登録名)。変更しない。
    name: "workflow セキュリティポリシーチェック"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install ghalint"
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=suzuki-shunsuke/ghalint
          VERSION: 1.5.6
          SHA256: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c
        run: |
          set -euo pipefail
          ARCHIVE="ghalint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" ghalint
          rm -f "$ARCHIVE"
          ghalint version

      - name: "ghalint"
        shell: bash
        env:
          GHALINT_LOG_COLOR: never  # annotation 生成のログ解析を色コードで壊さない
        run: |
          set -euo pipefail
          rc=0
          ghalint run 2>ghalint.log || rc=$?
          cat ghalint.log

          # ghalint は行番号を出力しないため、違反はワークフローファイル単位で PR に annotation 表示する
          if [ "${rc}" -ne 0 ] && [ -s ghalint.log ]; then
            grep ' ERR ' ghalint.log | while IFS= read -r line; do
              file=$(sed -n 's/.* workflow_file_path=\([^ ]*\).*/\1/p' <<< "${line}")
              policy=$(sed -n 's/.* policy_name=\([^ ]*\).*/\1/p' <<< "${line}")
              error=$(sed -n 's/.* error="\([^"]*\)".*/\1/p' <<< "${line}")
              if [ -n "${file}" ]; then
                echo "::error file=${file}::ghalint (${policy}): ${error}"
              fi
            done
          fi
          exit "${rc}"

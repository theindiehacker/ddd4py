name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  validation:
    name: 検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv のセットアップ
        # setup-uv は major/minor タグを publish していないため commit hash でピンする
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 依存の同期
        # --locked で uv.lock と pyproject.toml のズレも検出する。
        # --all-extras は Taskfile の init と同じ経路 (mypy が sqlalchemy アダプタも検査する)。
        run: uv sync --locked --all-extras

      - name: フォーマット検査
        # 整形は ruff format が唯一の基準。差分があれば `task style:fix` で解消する。
        run: uv run ruff format --check .

      - name: Ruff リント
        run: uv run ruff check .

      - name: 型チェック
        run: uv run mypy

      - name: テスト
        run: uv run pytest

      - name: Import Linter
        run: uv run lint-imports --no-logo

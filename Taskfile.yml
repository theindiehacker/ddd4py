version: '3'

tasks:
  init:
    desc: 開発環境のセットアップ
    cmds:
      - uv sync --all-extras
      - echo "✅ done"

  test:
    desc: テスト実行
    cmd: uv run pytest {{.CLI_ARGS}}

  style:check:
    desc: スタイル / 型の検査
    cmds:
      - uv run ruff check .
      - uv run mypy
      - uv run lint-imports --no-logo
      - echo "✅ ddd4py"

  style:fix:
    desc: スタイル自動修正
    cmd: uv run ruff check --fix .

  build:
    desc: 配布物のビルド
    cmd: uv build --out-dir dist
